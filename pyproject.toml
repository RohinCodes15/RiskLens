[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risklens"
version = "0.1.0"
description = "RiskLens Quant: a Streamlit portfolio risk analyzer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.63",  # oldest release whose AppTest exposes chart keys used by the suite
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/risklens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"  # list skip/xfail reasons, e.g. pending TODO(human) work

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]  # import order, likely bugs, modern syntax
