[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risklens"
version = "0.1.0"
description = "RiskLens Quant: a Streamlit portfolio risk analyzer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.35",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/risklens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
