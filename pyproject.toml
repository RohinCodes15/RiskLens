[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risklens"
version = "0.1.0"
description = "RiskLens Quant: a Streamlit portfolio risk analyzer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.63",  # oldest release whose AppTest exposes chart keys used by the suite
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.13"]  # 0.13 dropped UP038, matching current Ruff

[tool.hatch.build.targets.wheel]
packages = ["src/risklens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"  # list skip/xfail reasons; reject unknown markers
xfail_strict = true  # an expected failure that starts passing must be cleaned up

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
# Pin the rule set so newer Ruff defaults (e.g. TRY004, which conflicts with the
# repo rule "raise ValueError for bad input") do not change what `ruff check` enforces.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]  # Ruff defaults + imports, bugs, syntax
